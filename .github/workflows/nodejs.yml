name: CI

on:
  push:
    branches: [ "main", "master", "work" ]
  pull_request:
    branches: [ "main", "master", "work" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 18
    - run: sudo apt-get update && sudo apt-get install -y chromium-browser
    - run: npm install
    - run: npm test
